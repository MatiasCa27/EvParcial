name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Seguridad (Snyk + npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm ci

      - name: npm audit bloqueo en HIGH
        run: npm audit --audit-level=high

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Generar reporte Snyk
        if: always()
        run: |
          npx snyk test --json > snyk-report.json || echo "Snyk encontró vulnerabilidades"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Subir reporte de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report
          path: snyk-report.json

      - name: Alerta si seguridad falla
        if: failure()
        run: |
          echo "::error::El pipeline fue BLOQUEADO por vulnerabilidades de seguridad."
          echo "::error::Revisa npm audit, Snyk y el artefacto snyk-security-report."
          exit 1

  test:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MatiasCa27_EvParcial
            -Dsonar.organization=matiasca27
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: sonar

    steps:
      - name: Desplegar en AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/EvParcial
            git pull
            docker compose down
            docker compose up -d --build
            docker ps