name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Escaneo de vulnerabilidades con npm audit
        run: npm audit --audit-level=high

      - name: Análisis con SonarCloud
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MatiasCa27_EvParcial
            -Dsonar.organization=matiasca27
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**

      - name: Escaneo de seguridad con Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t evparcial-api .

      - name: Despliegue automático con Docker Compose
        run: docker compose up -d --build

      - name: Verificar contenedores activos
        run: docker ps