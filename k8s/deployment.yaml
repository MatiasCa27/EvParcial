apiVersion: apps/v1
kind: Deployment
metadata:
  name: evparcial-app
  namespace: evparcial-ns
  labels:
    app: evparcial
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evparcial
  template:
    metadata:
      labels:
        app: evparcial
        version: v1
    spec:
      containers:
      - name: evparcial-api
        image: httpbin/httpbin:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3